name: CI/CD Windows Build

on:
  push:
    branches: ["main", "develop", "feature/**", "bugfix/**", "release/**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      GOOS: windows
      GOARCH: amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies (desktop & printd)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @leandrosys/printd install
          pnpm --filter @leandrosys/desktop install

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build printd for Windows
        run: |
          cd apps/printd
          go build -o bin/printd.exe ./cmd/printd

      - name: Build desktop app for Windows
        run: |
          cd apps/desktop
          pnpm run build
          npx electron-builder --win --x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            apps/printd/bin/printd.exe
            apps/desktop/dist/*.exe
